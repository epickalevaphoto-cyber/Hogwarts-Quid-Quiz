<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет Игрока — Hogwarts Quidditch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">✦ Hogwarts Quidditch</div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <span id="player-info" style="font-weight: 500;">Загрузка...</span>
      <button class="btn btn-secondary" onclick="logout()">Выйти</button>
    </div>
  </header>

  <main class="container">
    <!-- Табло матча -->
    <div class="card">
      <div style="text-align: center;">
        <span class="subtitle">MATCH IN PROGRESS</span>
        <h2 style="margin: 5px 0 20px 0;">Текущий счет</h2>
      </div>

      <div class="score-board" style="display: flex; justify-content: space-around; align-items: center;">
        <div style="text-align: center;">
          <h3>Команда А</h3>
          <span id="score-a" class="score-display" style="font-size: 3em; font-weight: bold;">0</span>
        </div>

        <div style="text-align: center;">
          <div style="font-size: 1.2em;">Шаг: <strong id="current-step">1</strong></div>
          <div style="margin-top: 5px; color: #888;" id="snitch-status-text">Снитч спрятан</div>
        </div>

        <div style="text-align: center;">
          <h3>Команда Б</h3>
          <span id="score-b" class="score-display" style="font-size: 3em; font-weight: bold;">0</span>
        </div>
      </div>
    </div>

    <!-- Чат игроков -->
    <div class="card" style="margin-top: 20px;">
      <h3>Игровой Чат</h3>
      <div id="chat-messages" class="chat-box" style="height: 250px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); padding: 10px; margin-bottom: 10px; border-radius: 6px;">
        <!-- Сообщения чата -->
      </div>
      <form id="chat-form" style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" placeholder="Написать командующим и судье..." style="flex: 1; padding: 8px;">
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
    </div>
  </main>

  <!-- ПРАВИЛЬНЫЙ ПОРЯДОК ПОДКЛЮЧЕНИЯ СКРИПТОВ (без type="module") -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
