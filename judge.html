<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель Судьи — Hogwarts Quidditch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">✦ Hogwarts Quidditch</div>
    <button class="btn btn-secondary" onclick="logout()">Выйти</button>
  </header>

  <main class="container">
    <div class="header-title">
      <span class="subtitle">REFEREE CONSOLE</span>
      <h1>Панель судьи</h1>
    </div>

    <!-- Управление матчем -->
    <div class="card">
      <h3>Управление матчем</h3>
      <div class="score-board" style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
        <div class="team-score">
          <h4>Команда А</h4>
          <span id="score-a" class="score-display">0</span>
          <div style="margin-top: 10px;">
            <button class="btn btn-small" onclick="changeScore('a', 10)">+10</button>
            <button class="btn btn-small" onclick="changeScore('a', -10)">-10</button>
          </div>
        </div>

        <div class="match-info" style="text-align: center;">
          <div>Шаг: <strong id="current-step">1</strong></div>
          <div style="margin-top: 5px;">Статус: <span id="match-status">Ожидание</span></div>
          <div style="margin-top: 15px;">
            <button class="btn btn-primary" id="btn-next-step" onclick="nextStep()">Следующий шаг</button>
          </div>
        </div>

        <div class="team-score">
          <h4>Команда Б</h4>
          <span id="score-b" class="score-display">0</span>
          <div style="margin-top: 10px;">
            <button class="btn btn-small" onclick="changeScore('b', 10)">+10</button>
            <button class="btn btn-small" onclick="changeScore('b', -10)">-10</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Снитч -->
    <div class="card" style="margin-top: 20px;">
      <h3>Управление Снитчем</h3>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-warning" onclick="toggleSnitch('appeared')">Запустить Снитч</button>
        <button class="btn btn-secondary" onclick="toggleSnitch('hidden')">Скрыть Снитч</button>
      </div>
    </div>

    <!-- Чат -->
    <div class="card" style="margin-top: 20px;">
      <h3>Чат матча</h3>
      <div id="chat-messages" class="chat-box" style="height: 200px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); padding: 10px; margin-bottom: 10px; border-radius: 6px;">
        <!-- Сообщения чата загружаются здесь -->
      </div>
      <form id="chat-form" style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" placeholder="Введите сообщение..." style="flex: 1; padding: 8px;">
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
    </div>
  </main>

  <!-- ПРАВИЛЬНЫЙ ПОРЯДОК ПОДКЛЮЧЕНИЯ СКРИПТОВ (без type="module") -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/judge.js"></script>
</body>
</html>
