<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход игрока — Hogwarts Quidditch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="back" href="index.html">← На главную</a>
      <p class="eyebrow">PLAYER ACCESS</p>
      <h1>Вход игрока</h1>
      <p class="muted">Введите выданные судьёй логин и пароль.</p>
      <form id="player-login-form">
        <label>Логин<input id="username" required autocomplete="username"></label>
        <label>Пароль<input id="password" type="password" required autocomplete="current-password"></label>
        <button class="button" type="submit">Войти в игру</button>
        <div id="login-error" class="error"></div>
      </form>
    </section>
  </main>
  <script type="module" src="js/player-login.js"></script>
</body>
</html>
