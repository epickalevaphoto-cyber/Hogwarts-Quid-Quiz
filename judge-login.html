<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход для Судьи — Hogwarts Quidditch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 50px;">
    <div class="card">
      <h2>Панель Судьи</h2>
      <form id="judge-login-form">
        <div style="margin-bottom: 15px;">
          <label for="username">Логин судьи:</label>
          <input type="text" id="username" required autocomplete="username" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 20px;">
          <label for="passcode">Пароль:</label>
          <input type="password" id="passcode" required autocomplete="current-password" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <button type="submit" class="btn btn-warning" style="width: 100%;">Войти как Судья</button>
      </form>
    </div>
  </div>

  <!-- Подключение API Гугл Таблиц и логики входа -->
  <script src="js/api.js"></script>
  <script src="js/judge-login.js"></script>
</body>
</html>
