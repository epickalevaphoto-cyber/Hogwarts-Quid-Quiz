<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Главный Экран — Hogwarts Quidditch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">✦ Hogwarts Quidditch — Табло Матча</div>
  </header>

  <main class="container" style="max-width: 900px; margin: 20px auto;">
    <!-- Табло Счета и Этапа -->
    <div class="card" style="text-align: center;">
      <h2>Этап: <span id="stage-display" style="color: #f1c40f;">Загрузка...</span></h2>
      <p style="font-size: 1.2em; margin-bottom: 20px;">Ход: <strong id="turn-display" style="color: #2ecc71;">—</strong></p>

      <div style="display: flex; justify-content: space-around; align-items: center;">
        <div style="text-align: center;">
          <h3>Команда А</h3>
          <span id="score-a" style="font-size: 4em; font-weight: bold; color: #e74c3c;">0</span>
        </div>

        <div style="text-align: center; padding: 0 20px;">
          <small>Время на ход</small>
          <div id="timer-display" style="font-size: 3.5em; font-weight: bold; color: #e74c3c;">00:00</div>
        </div>

        <div style="text-align: center;">
          <h3>Команда Б</h3>
          <span id="score-b" style="font-size: 4em; font-weight: bold; color: #3498db;">0</span>
        </div>
      </div>
    </div>

    <!-- Чат Гостей (Только ОБЩИЙ) -->
    <div class="card" style="margin-top: 20px;">
      <h3>🌐 Прямой Эфир (Общий Чат)</h3>
      <div id="chat-messages" style="height: 350px; overflow-y: auto; background: #0f111a; padding: 15px; border-radius: 8px;"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/screen.js"></script>
</body>
</html>
